<script>
    function setAlarm() {
        const time = document.getElementById('alarmTime').value;
        if(time) {
            document.getElementById('status').innerText = 'Установлено на: ' + time;
            alert('Будильник успешно установлен на ' + time);
        } else {
            alert('Пожалуйста, выберите время!');
        }
    }
</script>
