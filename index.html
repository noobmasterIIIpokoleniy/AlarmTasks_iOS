<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlarmTasks iOS</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --accent-active: #0056b3;
            --border: #c7c7cc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="time"], textarea {
            width: 100%;
            font-size: 22px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: #fafafa;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            color: var(--text-main);
            text-align: center;
        }
        textarea {
            text-align: left;
            resize: none;
            height: 90px;
            font-size: 16px;
        }
        input[type="time"]:focus, textarea:focus {
            border-color: var(--accent);
            background: #fff;
        }
        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: var(--accent-active);
        }
        .status-card {
            text-align: center;
            background: #e5f1ff;
            border: 1px solid #b6d4fe;
            color: #084298;
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            font-weight: 500;
            display: none;
        }
        .status-card.active {
            display: block;
        }
    </style>
</head>
